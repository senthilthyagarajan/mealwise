};

function getShelfLife(n) {
  const k = n.toLowerCase().replace(/[\s()\/\-]/g,"_").replace(/_+/g,"_");
  return SHELF_LIFE[k] || 7;
}
function getDays(item) {
  const exp = new Date(item.boughtDate);
  exp.setDate(exp.getDate() + item.shelfLife);
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.ceil((exp - today) / 86400000);
}
function urgency(days) {
  if (days<=1) return {bg:"#fee2e2",text:"#dc2626",badge:"#dc2626",label:"Use today!"};
  if (days<=3) return {bg:"#fed7aa",text:"#c2410c",badge:"#ea580c",label:`${days}d left`};
  if (days<=7) return {bg:"#fef9c3",text:"#92400e",badge:"#ca8a04",label:`${days}d left`};
  return {bg:"#f0fdf4",text:"#166534",badge:"#16a34a",label:`${days}d left`};
}
function getCuisineIcon(c="") {
  for (const [k,v] of Object.entries(CUISINE_ICON)) { if (c.includes(k)) return v; }
  return "🍽";
}
function downloadFile(content, filename, type) {
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
}

async function generateRecipes(pantry, familySize, preferences, cuisinePref) {
  const urgent = [...pantry].sort((a,b)=>getDays(a)-getDays(b)).slice(0,12).map(i=>`${i.name} (${getDays(i)}d left)`);
  const all = pantry.map(i=>i.name).join(", ");
  const cuisineInstruction = cuisinePref === "Any (surprise me)"
    ? "Mix cuisines — e.g. Indian breakfast, Italian or Asian lunch, Mexican or Mediterranean dinner."
    : `All 3 meals should be in this style: ${cuisinePref}`;
  const prompt = `You are a vegetarian home chef. Generate 3 vegetarian meals (Breakfast, Lunch, Dinner) for a family of ${familySize}.
PANTRY — prioritise expiring: ${urgent.join(", ")}
All available: ${all}
Cuisine: ${cuisineInstruction}
Preferences: ${preferences || "family-friendly, balanced, practical home cooking"}
Rules: 100% vegetarian, only use pantry ingredients listed, name the specific cuisine for each meal, practical 4-5 sentence instructions.
Respond ONLY with valid JSON array (no markdown):
[{"type":"Breakfast","title":"Name","cuisine":"South Indian","ingredients":["item1","item2"],"instructions":"Steps here.","prepTime":"20 mins","serves":${familySize},"usesUrgent":false},{"type":"Lunch",...},{"type":"Dinner",...}]`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1400,messages:[{role:"user",content:prompt}]})
  });
  const data = await response.json();
  const text = data.content?.map(c=>c.text||"").join("") || "";
  return JSON.parse(text.replace(/```json|```/g,"").trim());
}

function AddItemForm({onAdd}) {
  const today = new Date().toISOString().slice(0,10);
  const [name,setName]=useState(""); const [qty,setQty]=useState("1"); const [unit,setUnit]=useState("units");
  const [cat,setCat]=useState("🥦 Vegetables"); const [date,setDate]=useState(today);
  const [shelf,setShelf]=useState(""); const [showSug,setShowSug]=useState(false);
  const catItems = CATEGORIES[cat]||[];
  const sugs = name.length>1 ? catItems.filter(i=>i.toLowerCase().includes(name.toLowerCase())).slice(0,5) : [];
  const computed = shelf||(name?getShelfLife(name):7);
  const handle = ()=>{
    if(!name.trim()) return;
    onAdd({id:Date.now(),name:name.trim(),quantity:qty,unit,category:cat,boughtDate:date,shelfLife:Number(computed)});
    setName(""); setQty("1"); setShelf(""); setShowSug(false);
  };
  return (
    <div style={{...CARD,position:"relative"}}>
      <p style={CT}>🛒 Add item to pantry</p>
      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:10,marginBottom:10}}>
        <div style={{position:"relative"}}>
          <label style={LS}>Item name</label>
          <input style={IS} value={name} onChange={e=>{setName(e.target.value);setShowSug(true);}} onBlur={()=>setTimeout(()=>setShowSug(false),150)} placeholder="e.g. Spinach, Pasta, Paneer" onKeyDown={e=>e.key==="Enter"&&handle()} />
          {showSug&&sugs.length>0&&<div style={{position:"absolute",top:"100%",left:0,right:0,background:"white",border:"1.5px solid #e8c97a",borderRadius:10,zIndex:100,boxShadow:"0 4px 16px rgba(0,0,0,0.1)"}}>
            {sugs.map(s=><div key={s} onMouseDown={()=>{setName(s);setShelf("");setShowSug(false);}} style={{padding:"8px 12px",cursor:"pointer",fontSize:13,color:"#3d1f0a",borderBottom:"1px solid #f0e0c0"}}>{s}</div>)}
          </div>}
        </div>
        <div><label style={LS}>Qty</label><input style={IS} type="number" value={qty} onChange={e=>setQty(e.target.value)} min="0.1" step="0.5"/></div>
        <div><label style={LS}>Unit</label>
          <select style={IS} value={unit} onChange={e=>setUnit(e.target.value)}>
            {["units","kg","g","L","ml","bunch","can","packet","tbsp","tsp"].map(u=><option key={u}>{u}</option>)}
          </select>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:10,marginBottom:14}}>
        <div><label style={LS}>Category</label>
          <select style={IS} value={cat} onChange={e=>setCat(e.target.value)}>
            {Object.keys(CATEGORIES).map(c=><option key={c}>{c}</option>)}
          </select>
        </div>
        <div><label style={LS}>Date bought</label><input style={IS} type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
        <div><label style={LS}>Shelf life (days)</label><input style={IS} type="number" value={shelf||computed} onChange={e=>setShelf(e.target.value)}/></div>
      </div>
      <button onClick={handle} style={PB}>+ Add to Pantry</button>
    </div>
  );
}

}

  return (
    <div style={{background:col.bg,border:`1.5px solid ${col.border}`,borderRadius:20,padding:"18px 22px",marginBottom:16}}>

          <div style={{marginTop:4,fontSize:12,color:"#9a7050"}}>{getCuisineIcon(meal.cuisine)} {meal.cuisine} · {meal.serves} serves · {meal.prepTime}</div>
        </div>

        <div style={{fontSize:11,fontWeight:700,color:col.accent,marginBottom:6,textTransform:"uppercase",letterSpacing:0.8}}>Ingredients</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:5}}>

}

  useEffect(()=>{localStorage.setItem("mw_prefs",prefs);},[prefs]);
  useEffect(()=>{localStorage.setItem("mw_cuisine",cuisine);},[cuisine]);

  const addItem=useCallback(item=>setPantry(p=>[item,...p]),[]);

    .filter(i=>filterCat==="All"||i.category===filterCat)

    .sort((a,b)=>sortBy==="expiry"?getDays(a)-getDays(b):a.name.localeCompare(b.name));

  };

            </button>
          </div>
          {error&&<div style={{marginBottom:10,fontSize:13,color:"#fde68a"}}>{error}</div>}
        </div>
        <div style={{maxWidth:760,margin:"0 auto",display:"flex",borderTop:"1px solid rgba(255,255,255,0.12)"}}>
          {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,background:"none",border:"none",borderBottom:tab===t.id?"3px solid white":"3px solid transparent",padding:"11px 4px",cursor:"pointer",fontSize:12,fontWeight:600,color:tab===t.id?"white":"rgba(255,255,255,0.5)",fontFamily:"'Noto Sans',sans-serif",transition:"all 0.2s"}}>{t.label}{t.count!==undefined?` (${t.count})`:""}</button>)}
        </div>
      </div>

      {/* Content */}
      <div style={{maxWidth:760,margin:"0 auto",padding:"22px 14px"}} className="fade-up" key={tab}>

        {tab==="pantry"&&<>
          <AddItemForm onAdd={addItem}/>
          {expiring.length>0&&<div style={{background:"#fff7ed",border:"1.5px solid #fed7aa",borderRadius:14,padding:"12px 16px",marginBottom:18,display:"flex",gap:12,alignItems:"center"}}>
            <span style={{fontSize:24}}>⚠️</span>
            <div><div style={{fontWeight:700,color:"#c2410c",fontSize:14}}>Use these soon!</div>
            <div style={{fontSize:13,color:"#9a3412"}}>{expiring.map(i=>i.name).join(" · ")}</div></div>
          </div>}
          <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap",alignItems:"flex-end"}}>
            <div style={{flex:1,minWidth:140}}><label style={LS}>Search</label><input style={IS} value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search..."/></div>
            <div style={{flex:1,minWidth:160}}><label style={LS}>Category</label>
              <select style={IS} value={filterCat} onChange={e=>setFilterCat(e.target.value)}>{cats.map(c=><option key={c}>{c}</option>)}</select>
            </div>
            <div><label style={LS}>Sort</label>
              <select style={IS} value={sortBy} onChange={e=>setSortBy(e.target.value)}>
                <option value="expiry">Expiry first</option><option value="name">A–Z</option>
              </select>
            </div>
            <div style={{alignSelf:"flex-end",display:"flex",gap:6}}>
              <button onClick={()=>downloadFile(pantry.map(i=>`"${i.name}","${i.category}","${i.quantity}","${i.unit}","${i.boughtDate}","${i.shelfLife}"`).join("\n"),"pantry.csv","text/csv")} style={SB}>⬇ CSV</button>
              <button onClick={()=>downloadFile(JSON.stringify(pantry,null,2),"pantry.json","application/json")} style={SB}>⬇ JSON</button>
            </div>
          </div>
          {filtered.length===0?<div style={{textAlign:"center",padding:48,color:"#c0a080"}}>
            <div style={{fontSize:52}}>🧺</div>
            <div style={{fontFamily:"'Noto Serif',serif",fontSize:18,color:"#7c4a1e",marginTop:12}}>Your pantry is empty</div>
            <div style={{fontSize:13,marginTop:4}}>Add your dal, pasta, veggies, spices above</div>
          </div>:filtered.map(item=><PantryItem key={item.id} item={item} onRemove={removeItem}/>)}
        </>}

        {tab==="recipes"&&<>
          {!todayMeals?<div style={{textAlign:"center",padding:56,color:"#c0a080"}}>
            <div style={{fontSize:60,marginBottom:16}}>🍽️</div>
            <div style={{fontFamily:"'Noto Serif',serif",fontSize:20,color:"#7c4a1e"}}>No meals generated yet</div>
            <div style={{fontSize:14,marginTop:6}}>Choose a cuisine and hit Generate above</div>
          </div>:<>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
              <div style={{fontFamily:"'Noto Serif',serif",fontSize:15,color:"#9a7050"}}>📅 {todayMeals.date}</div>
              <span style={{fontSize:12,background:"#fff7ed",border:"1px solid #fed7aa",padding:"3px 10px",borderRadius:20,color:"#c2410c",fontWeight:600}}>{todayMeals.cuisinePreference}</span>
            </div>
            {todayMeals.meals.map((m,i)=><MealCard key={i} meal={m} index={i}/>)}
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:8}}>
              <button onClick={()=>downloadFile(JSON.stringify(history,null,2),"recipes.json","application/json")} style={SB}>⬇ recipes.json</button>
              <button onClick={handleGenerate} disabled={generating} style={{...PB,fontSize:13}}>🔄 Regenerate</button>
            </div>
          </>}
        </>}

        {tab==="history"&&<>
          {history.length===0?<div style={{textAlign:"center",padding:48,color:"#c0a080"}}>
            <div style={{fontSize:48,marginBottom:12}}>📚</div>
            <div style={{fontFamily:"'Noto Serif',serif",fontSize:18}}>No recipes yet — generate some meals!</div>
          </div>:<>
            <div style={{marginBottom:20}}>
              <div style={{fontSize:12,fontWeight:700,color:"#9a7050",textTransform:"uppercase",letterSpacing:0.8,marginBottom:8}}>Cuisines in your archive</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {[...new Set(history.flatMap(r=>r.meals.map(m=>m.cuisine)).filter(Boolean))].map(c=><span key={c} style={{fontSize:12,background:"#fff7ed",border:"1px solid #fed7aa",padding:"3px 10px",borderRadius:20,color:"#c2410c"}}>{getCuisineIcon(c)} {c}</span>)}
              </div>
            </div>
            <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginBottom:16}}>
              <button onClick={()=>downloadFile(JSON.stringify(history,null,2),"recipes.json","application/json")} style={SB}>⬇ JSON</button>
            </div>
            {history.map((entry,ei)=><div key={ei} style={{marginBottom:30}}>
              <div style={{fontFamily:"'Noto Serif',serif",fontSize:15,fontWeight:700,color:"#7c2d12",marginBottom:10,paddingBottom:6,borderBottom:"1.5px solid #e8c97a",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span>📅 {entry.date}</span>
                {entry.cuisinePreference&&<span style={{fontSize:11,fontWeight:600,color:"#c2410c",background:"#fff7ed",padding:"2px 8px",borderRadius:20,border:"1px solid #fed7aa"}}>{entry.cuisinePreference.split("(")[0].trim()}</span>}
              </div>
              {entry.meals.map((m,mi)=><MealCard key={mi} meal={m} index={mi}/>)}
            </div>)}
          </>}
        </>}

        {tab==="setup"&&<div>
          <div style={CARD}>
            <p style={CT}>👨‍👩‍👧‍👦 Family settings</p>
            <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:12,marginBottom:14}}>
              <div><label style={LS}>Family name</label><input style={IS} value={familyName} onChange={e=>setFamilyName(e.target.value)}/></div>
              <div><label style={LS}>Family size</label><input style={IS} type="number" min={1} max={20} value={familySize} onChange={e=>setFamilySize(e.target.value)}/></div>
            </div>
            <div style={{marginBottom:12}}>
              <label style={LS}>Default cuisine</label>
              <select style={IS} value={cuisine} onChange={e=>setCuisine(e.target.value)}>{CUISINES.map(c=><option key={c}>{c}</option>)}</select>
            </div>
            <div>
              <label style={LS}>Dietary preferences</label>
              <textarea style={{...IS,height:80,resize:"vertical"}} value={prefs} onChange={e=>setPrefs(e.target.value)} placeholder="e.g. No onion no garlic on Tuesdays, kids love paneer, Friday pasta nights..."/>
            </div>
          </div>

          <div style={CARD}>
            <p style={CT}>🔑 API Key</p>
            <p style={{margin:"0 0 12px",fontSize:13,color:"#9a7050"}}>Required to generate recipes. Get yours free at console.anthropic.com</p>
            <label style={LS}>Anthropic API Key</label>
            <input style={IS} type="password" placeholder="sk-ant-..." onChange={e=>{window._apiKey=e.target.value;}} defaultValue={window._apiKey||""}/>
            <p style={{margin:"8px 0 0",fontSize:12,color:"#c0a080"}}>Stored only in your browser memory, never sent anywhere except Anthropic.</p>
          </div>

          <div style={CARD}>
            <p style={CT}>💾 Data</p>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
              <button onClick={()=>downloadFile(JSON.stringify(pantry,null,2),"pantry.json","application/json")} style={PB}>⬇ pantry.json</button>
              <button onClick={()=>downloadFile(JSON.stringify(history,null,2),"recipes.json","application/json")} style={SB}>⬇ recipes.json</button>
              <button onClick={()=>{if(window.confirm("Clear all pantry?"))setPantry([]);}} style={{...SB,borderColor:"#fca5a5",color:"#dc2626"}}>🗑 Clear Pantry</button>
            </div>
            <label style={LS}>Import pantry.json</label>
            <input type="file" accept=".json" onChange={e=>{
              const file=e.target.files[0]; if(!file) return;
              const r=new FileReader();
              r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(Array.isArray(d)){setPantry(d);alert(`✅ Imported ${d.length} items!`);}}catch{alert("Invalid JSON");}};
              r.readAsText(file);
            }} style={{fontSize:13,color:"#7c4a1e"}}/>
          </div>
        </div>}
      </div>
    </div>
  );
}

// Patch generateRecipes to use window._apiKey
const _orig = generateRecipes;
window.generateRecipesWithKey = async function(pantry, familySize, prefs, cuisine) {
  const urgent = [...pantry].sort((a,b)=>getDays(a)-getDays(b)).slice(0,12).map(i=>`${i.name} (${getDays(i)}d left)`);
  const all = pantry.map(i=>i.name).join(", ");
  const cuisineInstruction = cuisine === "Any (surprise me)"
    ? "Mix cuisines across the 3 meals."
    : `All 3 meals should be in this style: ${cuisine}`;
  const prompt = `You are a vegetarian home chef. Generate 3 vegetarian meals (Breakfast, Lunch, Dinner) for a family of ${familySize}.\nPANTRY — prioritise expiring: ${urgent.join(", ")}\nAll available: ${all}\nCuisine: ${cuisineInstruction}\nPreferences: ${prefs || "family-friendly"}\nRules: 100% vegetarian, only use pantry ingredients listed, name specific cuisine for each meal.\nRespond ONLY with valid JSON array:\n[{"type":"Breakfast","title":"Name","cuisine":"South Indian","ingredients":["item1"],"instructions":"Steps.","prepTime":"20 mins","serves":${familySize},"usesUrgent":false},{"type":"Lunch",...},{"type":"Dinner",...}]`;
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":window._apiKey||"","anthropic-version":"2023-06-01"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1400,messages:[{role:"user",content:prompt}]})
  });
  const data = await response.json();
  const text = data.content?.map(c=>c.text||"").join("") || "";
  return JSON.parse(text.replace(/```json|```/g,"").trim());
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
