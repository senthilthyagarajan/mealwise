name: Daily Recipe WhatsApp

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  send-recipes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate and send recipes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          cat << 'SCRIPT' > run.js
          const fs = require("fs");
          const https = require("https");

          let pantry = [];
          try {
            pantry = JSON.parse(fs.readFileSync("pantry.json", "utf8"));
          } catch (e) {
            console.log("No pantry.json found");
            process.exit(0);
          }

          if (pantry.length === 0) {
            console.log("Pantry is empty, skipping");
            process.exit(0);
          }

          function getDaysLeft(item) {
            var shelfLife = item.shelfLife || 7;
            var exp = new Date(item.boughtDate);
            exp.setDate(exp.getDate() + shelfLife);
            return Math.ceil((exp - new Date()) / 86400000);
          }

          var sorted = pantry.slice().sort(function(a, b) { return getDaysLeft(a) - getDaysLeft(b); });
          var urgent = sorted.slice(0, 10).map(function(i) { return i.name + " (" + getDaysLeft(i) + "d left)"; });
          var all = pantry.map(function(i) { return i.name; }).join(", ");

          var prompt = "Generate 3 vegetarian meals (Breakfast, Lunch, Dinner) for a family of 4.\n\nPrioritise expiring items: " + urgent.join(", ") + "\nAll pantry items: " + all + "\n\nFormat EXACTLY like this:\n\nBREAKFAST: [Meal Name]\nIngredients: item1, item2\nHow to make: Brief instructions.\n\nLUNCH: [Meal Name]\nIngredients: item1, item2\nHow to make: Brief instructions.\n\nDINNER: [Meal Name]\nIngredients: item1, item2\nHow to make: Brief instructions.";

          function callClaude(cb) {
            var body = JSON.stringify({
              model: "claude-sonnet-4-20250514",
              max_tokens: 600,
              messages: [{ role: "user", content: prompt }]
            });
            var req = https.request({
              hostname: "api.anthropic.com",
              path: "/v1/messages",
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "x-api-key": process.env.ANTHROPIC_API_KEY,
                "anthropic-version": "2023-06-01",
                "Content-Length": Buffer.byteLength(body)
              }
            }, function(res) {
              var data = "";
              res.on("data", function(d) { data += d; });
              res.on("end", function() {
                var parsed = JSON.parse(data);
                cb(null, parsed.content[0].text);
              });
            });
            req.on("error", function(e) { cb(e); });
            req.write(body);
            req.end();
          }

          function sendWhatsApp(message, cb) {
            var encoded = encodeURIComponent(message);
            var url = "https://api.callmebot.com/whatsapp.php?phone=" + process.env.CALLMEBOT_PHONE + "&text=" + encoded + "&apikey=" + process.env.CALLMEBOT_APIKEY;
            https.get(url, function(res) {
              var data = "";
              res.on("data", function(d) { data += d; });
              res.on("end", function() { console.log("WhatsApp:", data); cb(null); });
            }).on("error", function(e) { cb(e); });
          }

          function saveRecipe(text) {
            var history = [];
            try { history = JSON.parse(fs.readFileSync("recipes.json", "utf8")); } catch(e) {}
            var today = new Date().toLocaleDateString("en-AU", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
            history.unshift({ date: today, raw: text, generatedAt: new Date().toISOString() });
            if (history.length > 90) history = history.slice(0, 90);
            fs.writeFileSync("recipes.json", JSON.stringify(history, null, 2));
            console.log("Saved to recipes.json");
          }

          callClaude(function(err, meals) {
            if (err) { console.error("Claude error:", err); process.exit(1); }
            var today = new Date().toLocaleDateString("en-AU", { weekday: "long", month: "long", day: "numeric" });
            var message = "Mealwise - Family Meals for " + today + "\n\n" + meals + "\n\nGenerated from your pantry";
            sendWhatsApp(message, function(err) {
              if (err) { console.error("WhatsApp error:", err); process.exit(1); }
              saveRecipe(meals);
              console.log("Done!");
            });
          });
          SCRIPT
          node run.js

      - name: Commit updated recipes.json
        run: |
          git config user.name "Mealwise Bot"
          git config user.email "bot@github.com"
          git add recipes.json
          git diff --staged --quiet || git commit -m "Daily recipes $(date +'%Y-%m-%d')"
          git push
